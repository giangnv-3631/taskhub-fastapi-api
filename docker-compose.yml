services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/taskhub
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
